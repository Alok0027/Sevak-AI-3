name: sevakai_mobile
description: >
  SevakAI -- ASHA worker Android app. Offline-first voice recording,
  patient list with risk badges, and follow-up task list (SRS FR-07).
publish_to: "none"
version: 0.1.0

environment:
  sdk: ">=3.3.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:        # Material/date strings for hi, mr, ta, te, bn
    sdk: flutter
  http: ^1.2.1                 # calls the FastAPI backend
  sqflite: ^2.3.3               # on-device offline storage (FR-01.3, FR-07.1)
  path: ^1.9.0
  path_provider: ^2.1.3
  shared_preferences: ^2.2.3    # JWT + logged-in worker_id persistence
  flutter_secure_storage: ^10.0.0
  cryptography: ^2.7.0
  connectivity_plus: ^6.0.3     # offline/online detection for the sync indicator
  record: ^6.2.1                # microphone recording (5.x pinned an inconsistent record_linux/record_platform_interface pair)
  intl: ^0.20.3                 # date formatting for task list. Pinned to
                                # match flutter_localizations, which ships
                                # with the SDK and requires this range --
                                # ^0.19.0 made `flutter pub get` unsolvable
                                # on a current Flutter.
  google_fonts: ^6.2.1          # Hind + Anek (Indian Type Foundry); see theme/tokens.dart
  url_launcher: ^6.3.0          # Help screen: tel: and WhatsApp links to her ANM.
                                # An ASHA stuck at a doorstep rings somebody;
                                # a support form is not a substitute for that.

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  sqflite_common_ffi: ^2.3.6

flutter:
  uses-material-design: true

  assets:
    # The emblem, shown on the sign-in screen and used to generate every
    # launcher icon (see android/app/src/main/res and ios/.../AppIcon).
    - assets/brand/
