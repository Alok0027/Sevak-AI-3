<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" role="img" aria-label="SevakAI">
  <title>SevakAI — Shirorekha, small sizes</title>
  <!-- 16-24px variant. Same construction, but the glyph is opened up and
       the plate padding cut: at a browser-tab size the full mark spends
       too many of its pixels on green margin and the three strokes close
       into a smudge. Used below 24px; the full mark above it. -->
  <circle cx="32" cy="32" r="30" fill="#14624A"/>
  <rect x="11" y="17" width="42" height="8" rx="4" fill="#F7F9F8"/>
  <rect x="12" y="25" width="8" height="22" rx="4" fill="#F7F9F8"/>
  <rect x="28" y="25" width="8" height="15" rx="4" fill="#F7F9F8"/>
  <rect x="44" y="25" width="8" height="28" rx="4" fill="#F7F9F8"/>
</svg>
