# Render blueprint for the SevakAI backend.
#
#   Render dashboard -> New -> Blueprint -> pick this repo.
#
# Creates the API and its Postgres together, so the database URL is wired
# in rather than pasted. Two secrets are deliberately NOT in this file and
# must be set in the Render dashboard before the first deploy -- see
# `sync: false` below.
#
# The dashboard (React) is not here; it deploys to Vercel as a static
# build. Keeping them apart means a UI change does not rebuild and restart
# the API.

services:
  - type: web
    name: sevakai-api
    runtime: docker
    rootDir: backend            # build context == backend/, so the Dockerfile's
    dockerfilePath: ./Dockerfile # COPY . . picks up app/ and scripts/ and nothing else
    plan: free
    region: singapore           # closest Render offers to India; Oregon adds ~200ms per call
    healthCheckPath: /health    # a failing deploy rolls back instead of serving 502s

    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: sevakai-db
          property: connectionString
        # Render emits postgres://… , which SQLAlchemy 2 refuses to load a
        # dialect for. app/db/session.py rewrites it; nothing to do here.

      - key: JWT_SECRET
        generateValue: true     # a fresh random secret per environment, never in git

      - key: ENCRYPTION_KEY
        sync: false
        # NOT generated: this must be base64 of exactly 32 raw bytes or
        # app/core/encryption.py refuses to start, and a generated value
        # that happens not to decode to 32 bytes fails at the first patient
        # insert rather than at boot. Generate one and paste it in:
        #     cd backend && python scripts/generate_encryption_key.py
        #
        # It is also the one value you cannot lose or rotate casually --
        # every encrypted patient row is unreadable without the key that
        # wrote it. Keep a copy somewhere other than Render.

      - key: CORS_ORIGINS
        sync: false
        # The deployed dashboard's origin, e.g. https://sevakai.vercel.app
        # (no trailing slash -- CORS matches the origin exactly). You will
        # not know this until Vercel has deployed once, so set it after.

      - key: SEED_DEMO_ON_START
        value: "true"
        # A new Postgres has no accounts, and the free tier gives you no
        # shell to make one. Idempotent; turn it off once real data exists.

      # --- Provider switches -------------------------------------------
      # These match the working local .env: real Bhashini speech, a real
      # LLM, and the Meta WhatsApp Cloud API. Each one needs its
      # credentials set below before the first deploy -- a provider set to
      # real with an empty key fails at the first visit, not at boot.
      #
      # If you are deploying before pasting a given credential in, set that
      # one provider back to "mock" rather than leaving it real and empty.
      - key: USE_MOCKS
        value: "false"
      - key: STT_PROVIDER
        value: bhashini         # never "whisper" here: faster-whisper is
                                # not in the image (see backend/Dockerfile)
      - key: LLM_PROVIDER
        value: real
      - key: WHATSAPP_PROVIDER
        value: meta             # the Meta Cloud API, not Twilio's sandbox
      - key: SMS_PROVIDER
        value: mock             # "real" turns on the Twilio SMS fallback
                                # (SRS section 11 risk register). Off here
                                # because WhatsApp is the delivery channel;
                                # the TWILIO_* keys below exist for when it
                                # is wanted as a backup.

      - key: ENVIRONMENT
        value: production

      # --- Credentials -------------------------------------------------
      # sync: false means "this blueprint does not carry the value" -- set
      # each in the Render dashboard. They are the same values as in
      # backend/.env, which is git-ignored and never reaches the image
      # (see backend/.dockerignore).

      # WhatsApp Cloud API (WHATSAPP_PROVIDER=meta)
      - key: WHATSAPP_API_TOKEN
        sync: false
        # IMPORTANT: the token in backend/.env is a USER token, which
        # expires -- a deployment that outlives it starts failing every
        # send with error 190 and nothing else changes to explain why.
        # Generate a System User token (Business Settings -> System Users
        # -> Generate token, no expiry) and use that one here.
      - key: WHATSAPP_PHONE_NUMBER_ID
        sync: false
      - key: WHATSAPP_BUSINESS_ACCOUNT_ID
        sync: false
      - key: WHATSAPP_TEMPLATE_NAME
        value: followup_reminder
        # Must be APPROVED in Meta before it will send. Check with:
        #   cd backend && PYTHONPATH=. python scripts/create_whatsapp_template.py --list
      - key: WHATSAPP_TEMPLATE_LANGUAGE
        value: hi

      # Bhashini (STT_PROVIDER=bhashini)
      - key: BHASHINI_API_KEY
        sync: false
      - key: BHASHINI_USER_ID
        sync: false
      - key: BHASHINI_PIPELINE_ID
        sync: false

      # LLM (LLM_PROVIDER=real) -- Groq in the local .env
      - key: LLM_API_KEY
        sync: false
      - key: LLM_MODEL
        value: openai/gpt-oss-120b
      - key: LLM_BASE_URL
        value: https://api.groq.com/openai/v1

      # Twilio SMS -- only read when SMS_PROVIDER=real above.
      - key: TWILIO_ACCOUNT_SID
        sync: false
      - key: TWILIO_API_KEY_SID
        sync: false
      - key: TWILIO_API_KEY_SECRET
        sync: false
      - key: TWILIO_PHONE_NUMBER
        sync: false

databases:
  - name: sevakai-db
    plan: free
    region: singapore           # must match the service, or every query
                                # crosses a region and the free tier's
                                # connection limit starts to hurt
    postgresMajorVersion: "16"
